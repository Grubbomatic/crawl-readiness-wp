<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 256px; height: 256px; overflow: hidden; }
  .icon {
    width: 256px; height: 256px; box-sizing: border-box;
    background: linear-gradient(160deg, #3b74f0 0%, #2563eb 55%, #1d4ed8 100%);
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .tile {
    position: relative; width: 92px; height: 132px; border-radius: 12px;
    background: linear-gradient(180deg, #262a33 0%, #1a1d23 50%, #14161b 50%, #1a1d23 100%);
    box-shadow: 0 10px 22px rgba(10, 20, 60, 0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 92px; line-height: 1; color: #ffffff;
  }
  .tile::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px;
    background: rgba(0, 0, 0, 0.4); box-shadow: 0 1px 0 rgba(255,255,255,0.07);
  }
  .tile span { position: relative; top: 2px; }
</style>
</head>
<body>
  <div class="icon"><div class="tile"><span>C</span></div><div class="tile"><span>R</span></div></div>
</body>
</html>
