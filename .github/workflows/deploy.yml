# Deploys a release to wordpress.org when a version tag is pushed, so nobody
# types an SVN password again. The tag name is the version (1.0.1, not
# v1.0.1) and must match the plugin header and the readme's Stable tag.
#
# One repository secret: SVN_PASSWORD, the SVN password generated on the
# WordPress.org profile (Account & Security → SVN credentials). The
# username is not secret and sits here. Files to leave out of the deploy
# are listed in .gitattributes (export-ignore); the listing assets in
# .wordpress-org go to the top-level assets folder of the SVN repository.
name: Deploy to WordPress.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  deploy:
    name: Commit the tag to the plugin SVN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          HEADER=$(sed -n 's/^ \* Version:[[:space:]]*//p' crawl-readiness.php | tr -d '\r')
          STABLE=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag $TAG · header $HEADER · stable tag $STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$STABLE"

      # A PHP syntax error takes down every site running the plugin, so a
      # tag that doesn't parse never reaches wordpress.org.
      - name: Check every PHP file parses
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: grubbomatic
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: grubbomatic-crawl-readiness
